```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReSubmerged Servers</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #0b6385,
                    #06364f 45%,
                    #021522 100%
                );

            overflow: hidden;
        }

        .ocean {
            position: fixed;
            inset: 0;

            pointer-events: none;
        }

        .bubble {
            position: absolute;

            bottom: -50px;

            width: 15px;
            height: 15px;

            border: 1px solid rgba(255,255,255,.5);
            border-radius: 50%;

            animation: rise 8s linear infinite;
        }

        .bubble:nth-child(1) {
            left: 20%;
            animation-delay: 0s;
        }

        .bubble:nth-child(2) {
            left: 40%;
            width: 8px;
            height: 8px;
            animation-delay: 2s;
        }

        .bubble:nth-child(3) {
            left: 65%;
            width: 22px;
            height: 22px;
            animation-delay: 4s;
        }

        .bubble:nth-child(4) {
            left: 80%;
            width: 10px;
            height: 10px;
            animation-delay: 1s;
        }

        @keyframes rise {
            from {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 2;

            width: min(600px, calc(100% - 40px));

            padding: 60px 40px;

            text-align: center;

            border: 1px solid rgba(130, 230, 255, .25);
            border-radius: 24px;

            background: rgba(3, 30, 45, .7);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .4),
                inset 0 0 40px rgba(80, 220, 255, .05);

            backdrop-filter: blur(15px);
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            margin: 20px 0 10px;

            font-size: 42px;
        }

        h1 span {
            color: #58ddff;
        }

        p {
            color: #a8cfdd;

            line-height: 1.7;
        }

        .status {
            display: inline-block;

            margin-top: 20px;
            padding: 10px 18px;

            border-radius: 30px;

            color: #69efb5;

            background: rgba(50, 220, 150, .1);

            border: 1px solid rgba(50, 220, 150, .2);
        }
    </style>
</head>

<body>

    <div class="ocean">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <main class="card">

        <div class="icon">🌊</div>

        <h1>
            Re<span>Submerged</span>
        </h1>

        <p>
            Welcome to the ReSubmerged Servers website.
        </p>

        <p>
            If you can see this page, GitHub Pages is working correctly.
        </p>

        <div class="status">
            ● GitHub Pages is working
        </div>

    </main>

</body>
</html>
